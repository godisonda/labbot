name: build

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller packaging/labbot.spec --noconfirm --clean
      - uses: actions/upload-artifact@v4
        with:
          name: LabBot-windows
          path: dist/LabBot

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller packaging/labbot.spec --noconfirm --clean
      - uses: actions/upload-artifact@v4
        with:
          name: LabBot-macos
          path: dist/LabBot.app
